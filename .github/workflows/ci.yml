name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  application:
    name: Application verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      # Static, offline, and contacts no database. Runs before the rest so a
      # broken migration privilege boundary fails the build immediately.
      - name: Verify migration privilege invariant
        run: npm run security:migrations

      - name: Run lint
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Build production application
        env:
          APP_ENVIRONMENT: development
          APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://cibuildplaceholder.supabase.co
          SUPABASE_PROJECT_ID: cibuildplaceholder
        run: npm run build

      - name: Run secret scan
        run: npm run security:secrets -- --format github

      - name: Audit dependencies
        run: npm run security:audit

  # The R6 migration freeze (supabase/MIGRATION_FREEZE.md) was lifted by the
  # approved R6-F reconciliation (2026-08-18, see
  # docs/evidence/R6F-migration-history-reconciliation.md) -- this job's
  # migration-applying steps are no longer refused by the guarded runner on
  # that basis. It still requires the `cloud-test` environment's variables and
  # secrets to be configured (docs/deployment/CI_FOUNDATION.md) before it can
  # pass.
  cloud-test:
    name: Cloud TEST database and E2E
    if: github.event_name == 'push' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: cloud-test
    concurrency:
      group: dental-emr-cloud-test
      cancel-in-progress: false
    env:
      APP_ENVIRONMENT: test
      APP_URL: http://127.0.0.1:3000
      DATABASE_TEST_CONFIRMATION: I_UNDERSTAND_THIS_IS_A_DISPOSABLE_CLOUD_TEST_PROJECT
      E2E_TARGET_CONFIRMATION: I_UNDERSTAND_THIS_IS_SYNTHETIC_CLOUD_TEST_DATA
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_TEST_URL }}
      SUPABASE_DEV_PROJECT_ID: ${{ vars.SUPABASE_DEV_PROJECT_ID }}
      SUPABASE_PRODUCTION_PROJECT_ID: ${{ vars.SUPABASE_PRODUCTION_PROJECT_ID }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_TEST_PROJECT_ID }}
      SUPABASE_TEST_PROJECT_ID: ${{ vars.SUPABASE_TEST_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify required Cloud TEST metadata
        shell: bash
        run: |
          required=(
            SUPABASE_TEST_PROJECT_ID
            SUPABASE_TEST_URL
            SUPABASE_DEV_PROJECT_ID
          )
          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name must be configured on the protected cloud-test environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          SUPABASE_TEST_PROJECT_ID: ${{ vars.SUPABASE_TEST_PROJECT_ID }}
          SUPABASE_TEST_URL: ${{ vars.SUPABASE_TEST_URL }}
          SUPABASE_DEV_PROJECT_ID: ${{ vars.SUPABASE_DEV_PROJECT_ID }}

      - name: Verify Cloud TEST target separation
        run: npm run ci:test-target

      # Keep one canonical TEST database credential. The URI stays a protected
      # environment secret; its encoded password component is derived only inside this job so
      # the Supabase CLI cannot drift from the session-pooler connection.
      - name: Derive Cloud TEST database password
        env:
          SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          node --input-type=module -e "import { appendFileSync } from 'node:fs'; const url = new URL(process.env.SUPABASE_TEST_DB_URL ?? ''); const password = url.password; if (!password) throw new Error('SUPABASE_TEST_DB_URL must include a database password.'); process.stdout.write('::add-mask::' + password + '\n'); appendFileSync(process.env.GITHUB_ENV, 'SUPABASE_DB_PASSWORD=' + password + '\n');"

      - name: Link the designated Cloud TEST project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
        run: npx supabase link --project-ref "$SUPABASE_TEST_PROJECT_ID"

      - name: Preview pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
        run: npm run db:push:dry

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
        run: npm run db:push:test

      # ADR-018: the canonical baseline is production-shaped and installs no
      # extension. pgTAP is provisioned only into non-production projects, and
      # the pgTAP suites below cannot run without this step.
      - name: Provision non-production database test tooling
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
        run: npm run db:provision:test

      - name: Load idempotent synthetic fixtures
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
        run: npm run db:seed:test

      - name: Run pgTAP authorization suites
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
        run: npm run test:db

      - name: Diagnose failed P2-01 pgTAP suite
        if: failure()
        env:
          SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: psql "$SUPABASE_TEST_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/patient_authorization.test.sql

      - name: Check generated database types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
        run: npm run db:types:check:test

      - name: Lint public database schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
        run: npm run db:lint:test

      # Read-only. Asserts the hosted Auth posture; it never pushes config.
      - name: Verify hosted Auth posture
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
        run: npm run security:auth

      - name: Run database security advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
        run: npm run db:advisors:test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Create unique E2E run identifier
        shell: bash
        run: |
          run_suffix="${GITHUB_RUN_ID: -7}"
          attempt_suffix="${GITHUB_RUN_ATTEMPT: -2}"
          echo "E2E_RUN_ID=r${run_suffix}a${attempt_suffix}" >> "$GITHUB_ENV"

      - name: Run selected Playwright flows
        env:
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
          # Server-only. Used by the Next.js process for invitation actions and
          # by the R5 mid-session withdrawal harness. Never reaches the browser.
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_TEST_SECRET_KEY }}
          E2E_ORG_A_ID: ${{ vars.E2E_ORG_A_ID }}
          E2E_ORG_A_NAME: ${{ vars.E2E_ORG_A_NAME }}
          E2E_ORG_B_ID: ${{ vars.E2E_ORG_B_ID }}
          E2E_ORG_B_NAME: ${{ vars.E2E_ORG_B_NAME }}
          E2E_BRANCH_A1_ID: ${{ vars.E2E_BRANCH_A1_ID }}
          E2E_BRANCH_A1_NAME: ${{ vars.E2E_BRANCH_A1_NAME }}
          E2E_BRANCH_A2_ID: ${{ vars.E2E_BRANCH_A2_ID }}
          E2E_BRANCH_A2_NAME: ${{ vars.E2E_BRANCH_A2_NAME }}
          E2E_BRANCH_B1_ID: ${{ vars.E2E_BRANCH_B1_ID }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_OWNER_TOTP_SECRET: ${{ secrets.E2E_OWNER_TOTP_SECRET }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
          E2E_BRANCH_USER_EMAIL: ${{ secrets.E2E_BRANCH_USER_EMAIL }}
          E2E_BRANCH_USER_PASSWORD: ${{ secrets.E2E_BRANCH_USER_PASSWORD }}
          E2E_SUSPENDED_EMAIL: ${{ secrets.E2E_SUSPENDED_EMAIL }}
          E2E_SUSPENDED_PASSWORD: ${{ secrets.E2E_SUSPENDED_PASSWORD }}
        run: npm run test:e2e
